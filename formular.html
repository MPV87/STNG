<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STNG Aktion</title>

<style>
  .stng-form{
    max-width: 520px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    font-family: Arial, sans-serif;
    color: #fff;
  }

  .stng-form h2{
    margin-bottom: 20px;
    text-align: center;
  }

  .form-group{
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
  }

  .form-group label{
    font-size: 14px;
    margin-bottom: 6px;
    opacity: 0.9;
  }

  .form-group input{
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
  }

  .form-group input:focus{
    outline: none;
    border-color: #00f0ff;
  }

  .checkbox{
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  .checkbox input{
    width: auto;
  }

  button{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #00f0ff, #00ff99);
    color: #000;
    transition: 0.3s ease;
  }

  button:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,200,0.4);
  }

  .form-legal{
    font-size: 11px;
    opacity: 0.6;
    margin-top: 14px;
    line-height: 1.4;
  }

  body{
    background: #0b0f1a;
  }
</style>
</head>

<body>

<form action="mailto:office@kp-plattner.at" method="post" enctype="text/plain" class="stng-form">
  
  <h2>STNG Aktion</h2>

  <div class="form-group">
    <label for="name">Vor- & Nachname *</label>
    <input type="text" id="name" name="Name" required>
  </div>

  <div class="form-group">
    <label for="email">E-Mail *</label>
    <input type="email" id="email" name="E-Mail" required>
  </div>

  <div class="form-group">
    <label for="address">Adresse *</label>
    <input type="text" id="address" name="Adresse" required>
  </div>

  <div class="form-group">
    <label for="zip">PLZ / Ort *</label>
    <input type="text" id="zip" name="PLZ-Ort" required>
  </div>

  <div class="form-group checkbox">
    <input type="checkbox" id="age" required>
    <label for="age">Ich bestätige, dass ich über 18 Jahre alt bin *</label>
  </div>

  <div class="form-group checkbox">
    <input type="checkbox" id="privacy" required>
    <label for="privacy">Ich akzeptiere die Datenschutzbestimmungen *</label>
  </div>

  <input type="hidden" name="subject" value="STNG-Aktion">

  <button type="submit">Jetzt an Aktion teilnehmen</button>

  <p class="form-legal">
    *Aktion gültig ab sofort bis 27. März 2026. Versand ausschließlich an Personen über 18 Jahre.
    Aktion gültig nur solange der Vorrat reicht. Der Rechtsweg ist ausgeschlossen.
  </p>

</form>

</body>
</html>
