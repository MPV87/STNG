<!doctype html>
<html lang="de" id="top">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STNG Pouches — 5 Flavours</title>
  <meta name="description" content="STNG Pouches — 5 Geschmacksrichtungen. Qualität aus Schweden." />

  <!-- ✅ Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #07070a;
      --panel: rgba(255,255,255,0.06);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --line: rgba(255,255,255,0.14);
      --shadow: 0 20px 70px rgba(0,0,0,0.55);
      --radius: 22px;
      --max: 1180px;

      --berry: #ea4960;
      --rasp:  #a52f83;
      --mint:  #5f85c3;
      --cola:  #7b7b7b;
      --bubble:#eb5493;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html{ scroll-behavior: smooth; }

    body{
      margin: 0;
      font-family: "Poppins", sans-serif;
      font-weight: 400;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(1000px 700px at 80% 20%, rgba(255,255,255,0.05), transparent 60%),
        radial-gradient(900px 600px at 50% 90%, rgba(255,255,255,0.04), transparent 60%),
        var(--bg);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    .container{
      width: min(var(--max), calc(100% - 48px));
      margin: 0 auto;
    }

    /* NAV */
    .nav{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(7,7,10,0.85), rgba(7,7,10,0.35));
      border-bottom: 1px solid var(--line);
      transition: 220ms ease;
    }
    .nav.scrolled{
      background: linear-gradient(to bottom, rgba(7,7,10,0.92), rgba(7,7,10,0.62));
    }
    .nav-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 0;
      transition: 220ms ease;
    }

    .logo{
      height: 30px;
      transition: 220ms ease;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
    }
    .logo:hover{
      transform: scale(1.03);
    }

    .nav-links{
      display:flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .nav-links a:hover{
      color: var(--text);
    }

    /* HERO */
    .hero{ padding: 80px 0 40px; }

    h1{
      font-size: clamp(36px, 5vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 10px 0 16px;
    }

    .lead{
      font-weight: 400;
      font-size: 16px;
      color: var(--muted);
      line-height: 1.8;
    }

    /* Flavor Titles */
    .flavor h2{
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tag{
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .meta .chip{
      font-weight: 500;
      font-size: 13px;
    }

    .info-panel h3{
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 13px;
    }

    .desc{
      font-weight: 400;
    }

    /* Progress */
    .progress{
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress a{
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.15em;
    }

  </style>
</head>

<body>

<header class="nav" id="siteNav">
  <div class="container nav-inner">
    <a href="#top">
      <img src="sting-logo-white.png" alt="STNG Logo" class="logo">
    </a>
    <nav class="nav-links">
      <a href="#produkte">Produkte</a>
      <a href="#qualität">Qualität</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<!-- Rest deiner Seite bleibt unverändert -->

<script>
document.getElementById("year")?.textContent = new Date().getFullYear();

const nav = document.getElementById("siteNav");
window.addEventListener("scroll", () => {
  if (window.scrollY > 10) nav.classList.add("scrolled");
  else nav.classList.remove("scrolled");
});
</script>

</body>
</html>
